<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-label="Dispatch policy trade-off: fast vs cheap">
<title>Dispatch policy trade-off: fast vs cheap</title>

  <style>
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label { font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .muted { font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .value { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .grid  { stroke: #3d444d; stroke-width: 1; }
    .s0 { fill: #6e7681; }
    .s1 { fill: #4493f8; }
    .s2 { fill: #f0883e; }
  </style>

<text x="0" y="20" class="title">Dispatch policy trade-off: cheap serves one more request at a higher cost</text>
<rect x="0" y="38" width="12" height="12" rx="2" class="s1"/>
<text x="18" y="48" class="label">fast</text>
<rect x="74" y="38" width="12" height="12" rx="2" class="s2"/>
<text x="92" y="48" class="label">cheap</text>
<line x1="20" y1="228" x2="160" y2="228" class="grid"/>
<rect x="39.0" y="112.1" width="44" height="115.9" rx="2" class="s1"/>
<text x="61.0" y="106.1" text-anchor="middle" class="value">8</text>
<rect x="97.0" y="97.6" width="44" height="130.4" rx="2" class="s2"/>
<text x="119.0" y="91.6" text-anchor="middle" class="value">9</text>
<text x="90.0" y="250" text-anchor="middle" class="label">Requests served</text>
<line x1="200" y1="228" x2="340" y2="228" class="grid"/>
<rect x="219.0" y="140.0" width="44" height="88.0" rx="2" class="s1"/>
<text x="241.0" y="134.0" text-anchor="middle" class="value">11.25</text>
<rect x="277.0" y="97.6" width="44" height="130.4" rx="2" class="s2"/>
<text x="299.0" y="91.6" text-anchor="middle" class="value">16.67</text>
<text x="270.0" y="250" text-anchor="middle" class="label">Mean response (min)</text>
<line x1="380" y1="228" x2="520" y2="228" class="grid"/>
<rect x="399.0" y="162.8" width="44" height="65.2" rx="2" class="s1"/>
<text x="421.0" y="156.8" text-anchor="middle" class="value">5.8</text>
<rect x="457.0" y="97.6" width="44" height="130.4" rx="2" class="s2"/>
<text x="479.0" y="91.6" text-anchor="middle" class="value">11.6</text>
<text x="450.0" y="250" text-anchor="middle" class="label">Empty km</text>
<line x1="560" y1="228" x2="700" y2="228" class="grid"/>
<rect x="579.0" y="126.4" width="44" height="101.6" rx="2" class="s1"/>
<text x="601.0" y="120.4" text-anchor="middle" class="value">32.53</text>
<rect x="637.0" y="97.6" width="44" height="130.4" rx="2" class="s2"/>
<text x="659.0" y="91.6" text-anchor="middle" class="value">41.75</text>
<text x="630.0" y="250" text-anchor="middle" class="label">Total cost (€)</text>
<text x="0" y="272" class="muted">Scenario oviedo_refuel_stress, no station failures. UCS and A* give identical results.</text>
</svg>
